name: Bug report
description: Something does not work as documented. Not for security vulnerabilities.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security vulnerabilities must not be reported here.** See SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
